<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net;
                 style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self';">
    <title>Estadísticas - Cinecito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&family=Press+Start+2P&family=Bungee+Shade&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilos.css">

    <script type="module" src="./js/controllers/estadisticasController.js"></script>
</head>
<body>
    <header class="text-center">
        <div class="titulo-cinecito"><h1>Cinecito</h1></div>
        <div class="nombre"><h2>No olvides rebobinar</h2></div>
        <nav aria-label="Navegación principal"><a href="./principal.html">Principal</a></nav>
    </header>

    <main class="container">
        <form id="dep" class="row g-3 justify-content-center campos" novalidate>
            <h3 class="titulo w-100 text-center">Estadísticas</h3>

            <div class="col-12 col-md-4">
                <label for="totalRecaudado" class="form-label">Total recaudado</label>
                <input type="text" id="totalRecaudado" class="form-control" disabled>
            </div>

            <div class="col-12 col-md-4">
                <label for="masAlquilada" class="form-label">Película más alquilada</label>
                <input type="text" id="masAlquilada" class="form-control" disabled>
            </div>

            <div class="col-12 col-md-4">
                <label for="mejorFuncionario" class="form-label">Mejor funcionario</label>
                <input type="text" id="mejorFuncionario" class="form-control" disabled>
            </div>
        </form>

        <div class="listado text-center mt-4">
            <label for="peliculas-con-stock" class="form-label d-block">Películas con stock</label>
            <select id="peliculas-con-stock" class="form-select mx-auto" style="max-width: 32rem;" size="6"
                aria-label="Películas con stock"></select>
        </div>
    </main>

    <footer>
        <p>© 2026 - Proyecto de Analista Programador</p>
        <p>Dirección: Rincón 232 - Rosario</p>
    </footer>
</body>
</html>
