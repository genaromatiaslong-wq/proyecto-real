<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net;
                 style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self';">
    <title>Alquileres - Cinecito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&family=Press+Start+2P&family=Bungee+Shade&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilos.css">

    <script type="module" src="./js/controllers/alquileresController.js"></script>
</head>
<body>
    <header class="text-center">
        <div class="titulo-cinecito"><h1>Cinecito</h1></div>
        <div class="nombre"><h2>No olvides rebobinar</h2></div>
        <nav aria-label="Navegación principal"><a href="./principal.html">Principal</a></nav>
    </header>

    <main class="container">
        <form id="dep" class="row g-3 justify-content-center campos" novalidate>
            <h3 class="titulo w-100 text-center">Alquiler</h3>

            <div class="col-12 col-md-4">
                <label for="codigo" class="form-label">Código</label>
                <input type="number" id="codigo" class="form-control" required>
            </div>

            <div class="col-12 col-md-4">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" id="fecha" class="form-control" required>
            </div>

            <div class="col-12 col-md-4">
                <label for="codigo-funcionario" class="form-label">Funcionario</label>
                <select id="codigo-funcionario" class="form-select" required></select>
            </div>

            <div class="col-12 col-md-4">
                <label for="codigo-pelicula" class="form-label">Película</label>
                <select id="codigo-pelicula" class="form-select" required></select>
            </div>

            <div class="col-12 col-md-4">
                <label for="precio-pelicula" class="form-label">Precio</label>
                <input type="number" id="precio-pelicula" class="form-control" disabled>
            </div>

            <div class="col-12 col-md-4">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" id="cantidad" class="form-control" min="1" step="1">
            </div>

            <div class="col-12 col-md-4">
                <label for="total" class="form-label">Total</label>
                <input type="text" id="total" class="form-control" disabled>
            </div>

            <div class="col-12 botones text-center">
                <button type="button" class="btn btn-success" data-accion="agregar">Agregar</button>
                <button type="button" class="btn btn-danger" data-accion="eliminar">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-accion="limpiar">Limpiar</button>
            </div>
        </form>

        <div class="listado text-center mt-4">
            <label for="lista-alquileres" class="form-label d-block">Listado de alquileres</label>
            <select id="lista-alquileres" class="form-select mx-auto" style="max-width: 36rem;" size="6"
                aria-label="Listado de alquileres"></select>
        </div>
    </main>

    <footer>
        <p>© 2026 - Proyecto de Analista Programador</p>
        <p>Dirección: Rincón 232 - Rosario</p>
    </footer>
</body>
</html>
