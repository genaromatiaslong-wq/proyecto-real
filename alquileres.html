<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquiler de peliculas</title>
    <script src="./js/services/memoria.js"></script>
    <script src="./js/models/alquiler.js"></script>
    <script src="./js/services/videoclub.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap" rel="stylesheet">
</head>
<body onload="CargoDatosAlquileres()">
    <center>
        <div class="titulo-cinecito">
        <h1>Cinecito</h1>
        </div>
        <div class="nombre">
        <h2>No olvides rebobinar</h2>
        </div>
        <a href="./principal.html">Principal</a>
        <form id="dep">
            <h3 class="titulo">Alquiler</h3>
            <section>
                <div class="campos">
                    <label for="codigo">Código: </label>
                    <input type="number" id="codigo">

                    <label for="fecha">Fecha: </label>
                    <input type="date" id="fecha">

                    <label for="funcionario">Funcionario: </label>
                    <select id="codigo-funcionario"></select>

                    <label for="pelicula">Pelicula: </label>
                    <select id="codigo-pelicula" onchange="CargarPrecioPelicula()"></select>

                    <label for="precio">Precio: </label>
                    <input type="number" id="precio-pelicula" disabled>
                    <br><br>
                    <label for="cantidad">Cantidad: </label>
                    <input type="number" id="cantidad" onblur="CalculoTotal()">

                    <label for="total">Total: </label>
                    <input type="text" id="total" disabled>
                    <br><br>
                </div>
                <div class="botones">
                    <input class="btn_agregar" type="button" value="Agregar" onclick="AgregarAlquiler()">
                    <input class="btn_eliminar" type="button" value="Eliminar" onclick="EliminarAlquiler()">
                    <input class="btn_limpiar" type="button" value="Limpiar" onclick="InicializarAlquiler()">
                    <br><br>
                </div>
            </section>
        </form>

        <div class="listado">
            <select id="lista-alquileres" onchange="SeleccionarAlquiler()" size="6"></select>
        </div>
    </center>

</body>
<footer>
    <p>© 2026 - Proyecto de Analista Programador</p>
    <p>Dirección: Rincón 232 - Rosario</p>
</footer>
</html>
