<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionarios del VideoClub</title>
    <script src="./js/models/funcionario.js"></script>
    <script src="./js/services/memoria.js"></script>
    <script src="./js/services/videoclub.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap" rel="stylesheet">
</head>
<body onload="CargoDatosFuncionarios()">
    <center>
        <div class="titulo-cinecito"> 
        <h1>Cinecito</h1>
        </div>
        <div class="nombre">
        <h2>No olvides rebobinar</h2>
        </div>
        <a href="./principal.html">Principal</a>
        <form id="dep">
            <h3 class="titulo">ABM Funcionarios</h3>
            <section>
                <div class="campos">
                    <label for="codigo">Código: </label>
                    <input type="text" id="codigo">

                    <label for="nombre">Nombre: </label>
                    <input type="text" id="nombre">
                    
                    <label for="cedula">Cédula: </label>
                    <input type="text" id="cedula">
                    <br><br>
                </div>
                <div class="botones">
                    <input class="btn_agregar" type="button" value="Agregar" onclick="AgregarFuncionarios()">
                    <input class="btn_modificar" type="button" value="Modificar" onclick="ModificarFuncionario()">
                    <input class="btn_eliminar" type="button" value="Eliminar" onclick="EliminarFuncionario()">
                    <input class="btn_limpiar" type="button" value="Limpiar" onclick="InicializarFuncionario()">
                    <br><br>
                </div>
            </section>
        </form>

        <div class="listado">
            <select id="lista-funcionarios" onchange="SeleccionarFuncionarios()" size="6"></select>
        </div>
    </center>
</body>
<footer>

</footer>
