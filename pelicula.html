<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net;
                 style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self' https://api.tvmaze.com;">
<title>Películas - Cinecito</title>
    <script type="module" src="./js/controllers/peliculasController.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <center>
        <div class="titulo-cinecito">
        <h1>Cinecito</h1>
        </div>
        <div class="nombre">
        <h2>No olvides rebobinar</h2>
        </div>
        <a href="./principal.html">Principal</a>
        <form id="dep" class="row g-3 justify-content-center campos" novalidate>
            <h3 class="titulo w-100 text-center">ABM Películas</h3>

            <div class="col-12 col-md-6">
                <label for="codigo" class="form-label">Código</label>
                <input type="text" id="codigo" class="form-control" autocomplete="off" required>
            </div>

            <div class="col-12 col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <div class="input-group">
                    <input type="text" id="nombre" class="form-control" autocomplete="off" required>
                    <button type="button" class="btn btn-outline-info" data-accion="buscar-api"
                        aria-describedby="mensaje-api">
                        Buscar info
                    </button>
                </div>
                <small id="mensaje-api" class="form-text" role="status" aria-live="polite"></small>
            </div>

            <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" class="form-control" rows="2" required></textarea>
            </div>

            <div class="col-12 col-md-6">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" id="precio" class="form-control" min="0" step="0.01" required>
            </div>

            <div class="col-12 col-md-6">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" id="stock" class="form-control" min="0" step="1" required>
            </div>

            <div class="col-12 botones text-center">
                <button type="button" class="btn btn-success" data-accion="agregar">Agregar</button>
                <button type="button" class="btn btn-warning" data-accion="modificar">Modificar</button>
                <button type="button" class="btn btn-danger" data-accion="eliminar">Eliminar</button>
                <button type="button" class="btn btn-secondary" data-accion="limpiar">Limpiar</button>
            </div>
        </form>
        <div class="listado text-center mt-4">
            <label for="lista-peliculas" class="form-label d-block">Listado de películas</label>
            <select id="lista-peliculas" class="form-select mx-auto" style="max-width: 32rem;" size="6"
                aria-label="Listado de películas"></select>
        </div>
    </center>
</body>
    </center>
</body>

</footer>
</html>
